name: CI — StructOptima Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 20 * * *"        # nightly 02:00 IST: randomised design matrix (see the fuzz job)
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45            # a hung or runaway test fails the job instead of running for 6 hours
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pypdfium2==5.14.0   # test-only: PDF rendering check in test_drawings.py

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Upload coverage (Python 3.13 only)
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  fuzz:
    # 300 seeded random buildings (tests/test_design_matrix.py) and the other regression files, one file at a time
    # under the memory cap of tests/run_suite.py; a failing seed is printed in the log and reproduces exactly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Regression layer with 300 random buildings
        env:
          STRUCTOPTIMA_FUZZ_N: "300"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/run_suite.py --layer regression --timeout 7200 --out "$RUNNER_TEMP/tests"
      - name: Keep logs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-run
          path: ${{ runner.temp }}/tests/
